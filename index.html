function itemList(type){const f=filters[type];let list=(type==='cards'?cards:type==='sockets'?sockets:D.items).filter(i=>!i.catalogHidden&&has(itemText(i),f.q)&&(f.category==='全部'||i.category===f.category)&&(f.slot==='全部'||(type==='cards'?i.slot:equipmentSlot(i))===f.slot)&&(f.effect==='全部'||has(i.effect||i.description,f.effect))&&(f.job==='全部'||i.job==='所有職業'||has(i.job,f.job))&&(f.element==='全部'||i.element===f.element)&&(type!=='items'||(f.variant||!i.variant))&&(type!=='items'||i.playerItem));if(f.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));else if(f.sort==='priceDesc'||f.sort==='gold')list.sort((a,b)=>(priceValue(b)>0?priceValue(b):-1)-(priceValue(a)>0?priceValue(a):-1)||a.name.localeCompare(b.name,'zh-Hant'));else if(f.sort==='attackDesc')list.sort((a,b)=>(b.attackValue??-Infinity)-(a.attackValue??-Infinity)||a.name.localeCompare(b.name,'zh-Hant'));else if(f.sort==='defenseDesc')list.sort((a,b)=>(b.defenseValue??-Infinity)-(a.defenseValue??-Infinity)||a.name.localeCompare(b.name,'zh-Hant'));else if(f.sort==='weaponLevel')list.sort((a,b)=>(b.weaponLevel??-Infinity)-(a.weaponLevel??-Infinity)||a.name.localeCompare(b.name,'zh-Hant'));else if(f.sort==='priceAsc'||(type==='items'&&f.sort==='default'))list.sort((a,b)=>sortPrice(a)-sortPrice(b)||a.name.localeCompare(b.name,'zh-Hant'));else if(type==='items')list.sort((a,b)=>sortPrice(a)-sortPrice(b)||a.name.localeCompare(b.name,'zh-Hant'));return list;}

list.slice(0,f.limit).map(itemCard).join('')||empty()}</div>${pagination(list.length,f.limit)}${type==='cards'?note('卡片效果引用此自訂地圖資料。正式取得來源若未找到，會明確標示，不以猜測補值。'):''}`;}

function craftSelector(f,list){const order=['武器','頭飾','盔甲','盾','披肩','鞋子','裝飾品'],available=order.filter(g=>list.some(r=>broadSlot(I.get(r.result))===g)),groups=['全部',...available];if(f.slot!=='全部'&&!available.includes(f.slot))f.slot='全部';return `<div class="slot-selector craft-selector">${groups.map(g=>{const count=g==='全部'?list.length:list.filter(r=>broadSlot(I.get(r.result))===g).length;return `<button class="slot-button ${f.slot===g?'active':''}" data-action="filter" data-field="slot" data-value="${g}" aria-pressed="${f.slot===g}">${ic(slotIcons[g]||'hammer')}<b>${g}</b><small>${count} 組</small></button>`;}).join('')}</div>`;}
function renderCraft(){const f=filters.craft,all=D.recipes.filter(r=>has([named(r.result),...r.materials.map(m=>named(m.id))].join(' '),f.q)),list=all.filter(r=>f.slot==='全部'||broadSlot(I.get(r.result))===f.slot);return intro('合成工坊','','依裝備分類查配方，並從成品反查材料與來源。','合成 / 配方查詢')+craftSelector(f,all)+`<div class="filter-panel"><div class="filter-top">${localSearch(f.q,'搜尋成品或材料名稱…')}<span class="filter-count">${list.length} 組配方</span><a class="btn" href="#plan">${ic('checklist')} 製作清單</a></div><div class="chip-row"><button class="reset" data-action="reset">重設條件</button></div></div><div class="recipes-grid">${list.slice(0,f.limit).map(recipeCard).join('')||empty()}</div>${pagination(list.length,f.limit)}${note('配方來自地圖 MERGE 初始化表；同一成品可能有替代配方。原始材料數值 0 代表消耗一件非堆疊物品，清單已換算為 ×1。未列出的現金、任務或動態條件請在遊戲內確認。')}`;}
function setDesc(s){const lines=s.description.split('\n'),target=s.name==='抗魔套裝'?'護魔':s.name.replace('套裝','');let active=false,result=[];for(const line of lines){if(/^\(.+?\)套裝/.test(line)){active=line.includes('('+target+')');if(active&&!result.includes(line))result.push(line);}else if(active&&line.startsWith('-')&&!result.includes(line))result.push(line);else if(!line||line.includes('卡片屬性'))active=false;}return result.join('\n')||s.description.split('\n\n')[0]||'詳見物品說明與觸發資料。';}

function autoLoadMore(){
 if(infiniteBusy)return;
 const el=$('[data-infinite]'),f=filters[route];
 if(!el||!f)return;
 const rect=el.getBoundingClientRect();
 if(rect.top>window.innerHeight+700||rect.bottom<-200)return;
 infiniteBusy=true;
 if(infiniteObserver)infiniteObserver.disconnect();
 const y=window.scrollY;
 f.limit+=24;
 render();
 requestAnimationFrame(()=>{window.scrollTo(0,y);infiniteBusy=false;requestAnimationFrame(autoLoadMore);});
}
function queueAutoLoad(){if(infiniteTick)return;infiniteTick=true;requestAnimationFrame(()=>{infiniteTick=false;autoLoadMore();});}
function setupInfiniteScroll(){
 if(infiniteObserver){infiniteObserver.disconnect();infiniteObserver=null;}
 const el=$('[data-infinite]');
 if(!el)return;
 if('IntersectionObserver' in window){
  infiniteObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))autoLoadMore();},{rootMargin:'700px 0px'});
  infiniteObserver.observe(el);
 }
 requestAnimationFrame(queueAutoLoad);
}

function groupDrops(drops,type='item'){const map=new Map;for(const d of drops){const key=[type==='item'?d.item:d.monster,d.requiredItem||'',d.bonusRate||'',d.conditional?'1':'0'].join('|');if(!map.has(key))map.set(key,[]);map.get(key).push(d);}return [...map.values()];}
function dropRateInline(rows){const rateText=d=>{if(d.rate==null)return '條件';const base=`${num(d.rate)}%`;return d.rateVariable?`${base} × 掉落倍率`:base;},normal=rows.find(d=>d.kind==='MVP・一般模式'),chill=rows.find(d=>d.kind==='MVP・休閒模式');if(normal||chill)return `<div class="drop-mode-rates">${normal?`<span class="drop-mode-rate normal"><small>一般</small><b>${rateText(normal)}</b></span>`:''}${normal&&chill?'<i>·</i>':''}${chill?`<span class="drop-mode-rate chill"><small>休閒</small><b>${rateText(chill)}</b></span>`:''}</div>`;const d=rows[0];return `<div class="drop-mode-rates single"><span class="drop-mode-rate"><small>${d.kind==='一般掉落'?'掉落':esc(d.kind.replace('掉落',''))}</small><b>${rateText(d)}</b></span></div>`;}
function dropRow(rows,type='item',poolContext=false){const d=rows[0],i=I.get(d.item),m=M.get(d.monster),kinds=[...new Set(rows.map(x=>x.kind))],rateNote=rows.map(x=>x.conditionNote).filter(Boolean)[0],mvp=kinds.some(k=>k.startsWith('MVP・')),guaranteed=mvp&&rows.some(x=>x.rate>=100)&&!d.exclusivePool,label=d.exclusivePool?'MVP 隨機池':guaranteed?'MVP 必定掉落':mvp?'MVP 機率掉落':kinds[0];return `<div class="drop-row grouped ${poolContext?'in-pool':''}">${type==='item'?itemArt(i):`<span class="item-art">${m&&getPic(m)?`<img src="${getPic(m)}" alt="">`:ic('monster')}</span>`}<div>${goBtn(type==='item'?'i':'m',type==='item'?d.item:d.monster,esc(type==='item'?i?.name||d.item:m?.name||d.monster),'drop-name')}<small>${esc(label)}${mvp&&rows.length>1&&new Set(rows.map(r=>r.kind)).size===1&&rows.every(r=>r.rate===100)?` · ${rows.length} 次獨立獎勵`:String()}${d.rateVariable?' · 受掉落倍率影響':''}${d.requiredItem?' · 需持有 '+esc(named(d.requiredItem)):''}${type!=='item'&&d.exclusivePool?` · ${d.exclusivePick||1}/${d.exclusiveOf||'?'} 隨機池`:''}</small>${rateNote?`<small class="drop-condition">${esc(rateNote)}</small>`:''}</div>${dropRateInline(rows)}<button class="icon-button" data-action="source" data-line="${d.line}" aria-label="查看掉落程式來源">${ic('code')}</button></div>`;}
function dropPoolBlock(poolRows,type='item'){const first=poolRows[0],n=first.exclusiveOf||new Set(poolRows.map(d=>d.item)).size,pick=first.exclusivePick||1,itemGroups=groupDrops(poolRows,type);return `<section class="drop-pool-card"><div class="drop-pool-head"><div><small>隨機掉落池</small><b>本次擊殺從以下 ${n} 件中隨機 ${pick} 件</b></div><span>${pick} / ${n}</span></div><div class="drop-list pool-list">${itemGroups.map(g=>dropRow(g,type,true)).join('')}</div></section>`;}
function dropList(drops,type='item'){const kinds=[...new Set(drops.map(d=>d.kind))],shown=dropMode==='all'?drops:drops.filter(d=>d.kind===dropMode),poolMap=new Map,independent=[];for(const d of shown){if(type==='item'&&d.exclusivePool){if(!poolMap.has(d.exclusivePool))poolMap.set(d.exclusivePool,[]);poolMap.get(d.exclusivePool).push(d);}else independent.push(d);}const groups=groupDrops(independent,type),body=`<div class="drop-list">${groups.map(g=>dropRow(g,type)).join('')}</div>${[...poolMap.values()].map(rows=>dropPoolBlock(rows,type)).join('')}`;return (kinds.length>1?`<div class="detail-mode"><button class="chip ${dropMode==='all'?'active':''}" data-action="drop-mode" data-value="all">全部來源</button>${kinds.map(k=>`<button class="chip ${dropMode===k?'active':''}" data-action="drop-mode" data-value="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:'')+(shown.length?body:'<p class="detail-source-meta">尚未解析到符合條件的掉落記錄。</p>')+(drops.some(d=>d.kind?.startsWith('MVP・'))?note('MVP 戰利品依實際程式分成「必定掉落、獨立機率、隨機掉落池」。隨機池表示單次擊殺只會從該組候選中抽出指定件數；只有實際乘上 udg_const_i_DropRateMult 的項目才標示掉落倍率。'):'')+`<div id="detail-source"></div>`;}

function itemDetail(i){const ds=byItem.get(i.id)||[],recipes=recipeResult.get(i.id)||[],uses=recipeMaterial.get(i.id)||[],sets=D.sets.filter(s=>s.itemIds.includes(i.id)),position=i.slot||equipmentSlot(i),compatible=i.category==='卡片'?sockets.filter(x=>equipmentSlot(x)===i.slot):i.sockets>0&&!i.variant?cards.filter(c=>c.slot===position):[];let pane='';if(detailTab==='sources'||detailTab==='drops'){pane=`<h2>取得方式</h2>${acquisitionPanel(i,ds,recipes)}${ds.length?`<h3 class="subsection-title">魔物掉落</h3>${dropList(ds,'monster')}`:''}`;}else if(detailTab==='craft'){pane=`<h2>製作這件物品</h2><div class="recipes-grid">${recipes.map(recipeCard).join('')||'<p class="detail-source-meta">此物件未列在已解析的合成成品表。</p>'}</div>${recipes.map(r=>sourceBlock(r)).join('')}<h2 style="margin-top:28px">它也是這些配方的材料</h2><div class="recipes-grid">${uses.map(recipeCard).join('')||'<p class="detail-source-meta">未列在已解析的合成材料表。</p>'}</div>`;}else if(detailTab==='links'){pane=`${sets.length?`<h2>套裝</h2><div class="set-members">${sets.map(s=>goBtn('s',s.id,esc(s.name)+' ↗')).join('')}</div>`:''}<h2>${i.category==='卡片'?'同部位可嵌卡裝備':i.sockets>0?'同部位可用卡片':'關聯資料'}</h2>${compatible.length?`<p>依地圖部位族群配對：${esc(position)}。實際嵌入仍以遊戲檢查為準。</p><div class="items-grid">${compatible.map(itemCard).join('')}</div>`:note('目前沒有其他可展示的嵌卡或套裝關聯。')}`;}else{pane=`<h2>物品說明</h2><div class="description">${esc(i.description||'無說明')}</div>${/<[A-Za-z0-9]{4},/.test(i.description||'')?note('說明中的 <物件,欄位> 為遊戲動態文字參照；未取得可靠值時保留原文。'):''}${structuredItemRows(i,position)}${recipes.length?`<button class="btn" data-action="detail-tab" data-value="craft" style="margin-top:20px">查看合成配方 ${ic('arrow')}</button>`:''}${(ds.length||i.shopSources?.length||i.triggerSources?.length||i.availabilityStatus)?`<button class="btn" data-action="detail-tab" data-value="sources" style="margin:20px 0 0 10px">查看取得方式 ${ic('arrowUp')}</button>`:''}${i.category==='卡片'||i.sockets>0?`<button class="btn" data-action="detail-tab" data-value="links" style="margin:20px 0 0 10px">${i.cate function setDetail(s){return `<div class="detail-content"><div class="page-intro"><div class="eyebrow">套裝資料</div><h1>${esc(s.name)}</h1><p>${esc(s.type)} · ${s.groups.length} 個判斷族群</p></div><div class="detail-pane"><h2>組成裝備</h2>${s.groups.map((g,n)=>`<div class="set-options"><h3>${n+1}. ${esc(g.label)}</h3><p class="detail-source-meta">此族群中符合條件的物件擇一，不是全部都要持有。</p><div class="set-members">${g.items.map(id=>goBtn('i',id,`${itemArt(I.get(id))}${esc(named(id))}`)).join('')}</div></div>`).join('')}<h2>道具說明中的效果</h2><div class="description">${esc(setDesc(s))}</div><h2 style="margin-top:25px">觸發程式中的內部值</h2><div class="description">${esc(s.triggerChanges.join('\n')||'此段沒有可簡化顯示的固定增量，請查看來源。')}</div>${note(s.note)}${sourceBlock(s)}<details class="source-block"><summary>完整原始說明（包含族群的卡片變體）</summary><div class="description">${esc(s.description)}</div></details></div></div>`;}
function showDetail(type,id){const record=(type==='m'?M:type==='s'?S:I).get(id);if(!record)return;const previous=detailEntity;detailEntity={type,id};if(previous&&(previous.type!==type||previous.id!==id)&&!['overview','sources','craft','links','drops','map'].includes(detailTab))detailTab='overview';if(type==='m'&&!['overview','drops','map','sources'].includes(detailTab))detailTab='overview';if(type==='i'&&!['overview','sources','craft','links','drops'].includes(detailTab))detailTab='overview';$('#detail-inner').innerHTML=detailHeader(type,id)+(type==='m'?monsterDetail(record):type==='s'?setDetail(record):itemDetail(record));if(!detail.open)detail.showModal();if(!previous||previous.id!==id)detail.scrollTop=0;syncModal();}
function renderCompareBar(){const bar=$('#compare-bar');bar.hidden=!compare.length;bar.innerHTML=`${ic('compare')}<span>${compare.length} / 3 · ${compare.map(id=>esc(M.get(id)?.name||id)).join('、')}</span><button class="btn btn-primary" data-action="compare-open" ${compare.length<2?'disabled':''}>開始比較 ${ic('arrow')}</button><button class="icon-button" data-action="compare-clear" aria-label="清除比較">${ic('x')}</button>`;}

let filterTimer;
document.addEventListener('input',e=>{if(e.target.id==='global-input'){renderSearch(e.target.value);return;}if(e.isComposing)return;const field=e.target.dataset.filter;if(['q','min','max'].includes(field)){clearTimeout(filterTimer);const currentRoute=route;filterTimer=setTimeout(()=>{if(route===currentRoute)setFilter(field,e.target.value);},160);}});
document.addEventListener('change',async e=>{const field=e.target.dataset.filter;if(field&&!['q','min','max'].includes(field)){if(field==='worldArea'){world.area=e.target.value;world.monster='all';world.shop=null;world.cell=null;render();}else if(field==='worldMonster'){world.monster=e.target.value;world.shop=null;world.cell=null;render();}else setFilter(field,e.target.type==='checkbox'?e.target.checked:e.target.value);}if(e.target.dataset.plan)updatePlan(e.target.dataset.plan,Number(e.target.value));if(e.target.id==='import-notebook'){const f=e.target.files?.[0];if(!f)return;try{if(f.size>1000000)throw new Error('檔案太大');const parsed=JSON.parse(await f.text());if(parsed.format!=='ROATLAS-notebook-v1'||!Array.isArray(parsed.favorites)||!parsed.plan||typeof parsed.plan!=='object')throw new Error('格式不符');let count=0;parsed.favorites.forEach(k=>{if(typeof k!=='string')return;const type=k.slice(0,2),id=k.slice(2);if(type==='m:'&&M.has(id)||type==='i:'&&I.has(id)){favorites.add(k);count++;}});Object.entries(parsed.plan).forEach(([id,n])=>{if(R.has(id)&&Number.isFinite(Number(n)))plan[id]=Math.min(99,Math.max(1,Math.round(Number(n))));});saveStore();render();toast('手帳已匯入，與目前收藏合併。');}catch{toast('檔案無法匯入，請選擇 RO ATLAS 匯出的手帳 JSON。');}}});
document.addEventListener('compositionend',e=>{if(e.target.dataset.filter==='q'){clearTimeout(filterTimer);setFilter('q',e.target.value);}});
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select,[contenteditable]');if(searchDialog.open&&e.target.id==='global-input'){if(e.key==='ArrowDown'){e.preventDefault();moveSearchSelection(1);return;}if(e.key==='ArrowUp'){e.preventDefault();moveSearchSelection(-1);return;}if(e.key==='Enter'&&searchIndex>=0){e.preventDefault();activateSearchSelection();return;}}if((e.key==='/'&&!typing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openSearch();}});
$('#mobile-shade').addEventListener('click',closeMenu);
searchDialog.addEventListener('submit',e=>{e.preventDefault();$('.search-result',searchDialog)?.click();});
[detail,searchDialog,compareDialog].forEach(d=>{d.addEventListener('click',e=>{if(e.target===d){const rect=d.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom){if(d===detail)closeDetail();else d.close();syncModal();}}});d.addEventListener('close',()=>{if(d===detail&&detailEntity)closeDetail();syncModal();});});
window.addEventListener('hashchange',hashChanged);
window.addEventListener('storage',e=>{if(e.key===savedKey){favorites=new Set(cleanFavorites(readStore(savedKey,[])));render();}});
hydrate();hashChanged();
})();
</script>
</body></html>
