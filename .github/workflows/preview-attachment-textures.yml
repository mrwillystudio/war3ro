name: Preview attachment materials
on:
  push:
    branches: [atlas/front-model-previews-20261030]
    paths: ['.github/workflows/preview-attachment-textures.yml']
permissions:
  contents: read
jobs:
  attachment-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact attachment texture paths
        run: |
          mkdir -p /tmp/attachment-materials
          python - <<'PY'
          import pathlib,urllib.request,urllib.parse,hashlib,json
          O=pathlib.Path('/tmp/attachment-materials');idx={};errors={}
          paths=['Textures/HellscreamChaos.blp','UI/Glues/MainMenu/MainMenu3d/ShieldWood.blp','Textures/demolisher.blp','units/undead/skeleton/Skeleton.blp']
          for name in paths:
              key=name.replace('/','\\').lower()
              urls=['https://www.hiveworkshop.com/data/static_assets/mpq/tft/'+name.lower(),'https://www.hiveworkshop.com/casc-contents?'+urllib.parse.urlencode({'path':key})]
              for url in urls:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 MDX-Preview-Asset-Resolver'})
                      with urllib.request.urlopen(req,timeout=25) as r:b=r.read()
                      assert b[:4] in [b'BLP1',b'BLP2']
                      fn=hashlib.sha256(key.encode()).hexdigest()[:20]+'.blp';(O/fn).write_bytes(b)
                      idx[key]={'file':fn,'source':url,'sha256':hashlib.sha256(b).hexdigest()};break
                  except Exception as e:errors[key]=str(e)
          (O/'native-index.json').write_text(json.dumps(idx,indent=2));(O/'errors.json').write_text(json.dumps({k:v for k,v in errors.items() if k not in idx}));print('MATERIALS',len(idx))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-attachment-materials
          path: /tmp/attachment-materials/
          retention-days: 7
