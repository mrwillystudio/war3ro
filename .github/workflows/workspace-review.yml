name: World workspace review
on:
  push:
    branches: [feat/world-correction-workspace]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build inline workspace and check syntax
        run: python .workspace/build.py
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Regression tests on real Chromium
        run: python .workspace/test.py
      - name: Prepare tested index blob (does not change any branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          content=Path('index.html').read_text(encoding='utf-8')
          raw=content.encode('utf-8')
          expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          request=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response: result=json.load(response)
          assert result['sha']==expected
          summary={'index_blob_sha':result['sha'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'test_run':os.environ['GITHUB_RUN_ID']}
          Path('.workspace/review/index-blob.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-world-workspace
          path: |
            index.html
            .workspace/review/
          include-hidden-files: true
          retention-days: 7
