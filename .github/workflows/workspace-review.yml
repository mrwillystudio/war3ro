name: World workspace deployment check
on:
  push:
    branches: [feat/world-correction-workspace]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare deployed HTML with the tested index
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from datetime import datetime,timezone
          expected='a573bcc3d64ec4a8e680b1a67b5608d5b5b49364'
          base='https://war3ro.mrwillytw.workers.dev/'
          last={}
          for attempt in range(18):
              try:
                  req=urllib.request.Request(base+'?workspace-deployment-check='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'RO-ATLAS-deployment-verification'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      raw=response.read()
                      last={'url':base+'#world?p=workspace','http_status':response.status,'bytes':len(raw),'blob_sha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest(),'checked_at':datetime.now(timezone.utc).isoformat()}
                  if last['blob_sha']==expected:
                      last['production_matches_tested_index']=True
                      print(json.dumps(last),flush=True)
                      break
                  print(json.dumps(last),flush=True)
              except Exception as e:print(type(e).__name__+': '+str(e),flush=True)
              time.sleep(5)
          else:raise SystemExit('Production did not return the tested index during this verification; GitHub update is separate.')
          PY
