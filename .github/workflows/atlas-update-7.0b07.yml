name: Atlas 7.0b07 refresh
on:
  push:
    branches: [atlas/update-7.0b07-20261030]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tools/verify_live_70b07.py ]; then
            python tools/verify_live_70b07.py
          else
            command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
            python tools/update_atlas_70b07.py
            node --check atlas-data/update-70b07.js
          fi
      - name: Export review package
        run: |
          mkdir -p /tmp/atlas-review
          cp index.html wrangler.jsonc /tmp/atlas-review/
          cp -R atlas-data /tmp/atlas-review/
          cp -R tools /tmp/atlas-review/
          if [ -f atlas-update-report.json ]; then cp atlas-update-report.json /tmp/atlas-review/; fi
          if [ -f atlas-live-verification.json ]; then cp atlas-live-verification.json /tmp/atlas-review/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-review
          path: /tmp/atlas-review/
          retention-days: 7
