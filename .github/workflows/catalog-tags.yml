name: Validate catalog labels
on:
  push:
    branches: [atlas/catalog-tags-20261030]
    paths: ['.github/workflows/catalog-tags.yml']
permissions:
  contents: write
jobs:
  catalog-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare narrowly scoped display changes
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = '73d82c4ce447363b7a355a024ab4e8d780ec3999'
          git worktree add --detach /tmp/atlas-candidate 73d82c4ce447363b7a355a024ab4e8d780ec3999
          mkdir -p /tmp/atlas-candidate/tools/catalog /tmp/catalog-qa
          cat > /tmp/atlas-candidate/tools/catalog/item-card-tags.js <<'JS'
          /* Shared item-card labels. Keep raw stats and detail data unchanged. */
          function itemCardLabels(i) {
            const text = value => typeof value === 'string' ? value.trim() : '';
            const missing = value => !value || /^(?:未知|未確認|待確認|未提供|未提供可解析限制|尚未取得|未標示|不明|—|-)$/.test(value);
            const unrestricted = value => /^(?:所有職業|全部職業|全職業|不限|無限制|不限制|不限職業|無職業限制|所有職業可用|全職業可用)$/.test(value.replace(/\s+/g, ''));
            const labels = [];
            const element = text(i.element);
            if (!missing(element)) labels.push({kind:'element', text: /屬性$/.test(element) ? element : element + '屬性'});
            const rawJob = text(i.job);
            const source = rawJob || (Array.isArray(i.jobTags) ? i.jobTags.filter(v=>typeof v==='string').join('／') : '');
            if (!missing(source) && !unrestricted(source)) {
              const jobs = [...new Set(source.replace(/^(?:職業限制|限定職業|適用職業)\s*[:：]\s*/, '')
                .split(/\s*[\/／、,，;；|]\s*/)
                .map(j=>j.trim().replace(/\s*系列$/, '系').replace(/(?:專屬|限定|可用)$/, '').trim())
                .filter(j=>!missing(j)))];
              if (jobs.length && !jobs.some(unrestricted)) labels.push({kind:'job', text: jobs.join('／') + (jobs.length===1 && !jobs[0].endsWith('系') ? '專屬' : '限定')});
            }
            return labels;
          }
          function itemStatPills(i) {
            const labels = itemCardLabels(i);
            return labels.length ? `<div class="item-stat-pills">${labels.map(label=>`<span data-item-label="${label.kind}">${esc(label.text)}</span>`).join('')}</div>` : '';
          }
          JS
          cat > /tmp/atlas-candidate/tools/catalog/apply_catalog_tags.py <<'PY'
          """Apply card labels only; never modify game data or model assets."""
          from pathlib import Path
          import sys,re
          root=Path(sys.argv[1] if len(sys.argv)>1 else '.')
          code=Path(__file__).parent;page=root/'index.html';s=page.read_text(encoding='utf-8')
          helper=(code/'item-card-tags.js').read_text(encoding='utf-8').rstrip()
          if helper in s:
              print('Approved labels already installed');raise SystemExit(0)
          matches=list(re.finditer(r'^function itemStatPills\(i\)\{.*?\}$',s,re.M))
          if len(matches)!=1:raise SystemExit('Expected one original function; refusing ambiguous patch')
          start,end=matches[0].span();s=s[:start]+helper+s[end:]
          old='可依名稱、價格、職業、屬性、攻擊、防禦與武器等級查找；NPC／商店名稱也可搜尋。預設價格由低到高。'
          new='小標顯示屬性與限定職業；可依名稱、價格、職業或屬性查找，NPC／商店名稱也可搜尋。預設價格由低到高。'
          if old not in s:raise SystemExit('Expected warehouse introduction missing')
          s=s.replace(old,new,1).replace(",['weaponLevel','武器等級：高 → 低']",'',1)
          page.write_text(s,encoding='utf-8')
          PY
          cat > /tmp/atlas-candidate/tools/catalog/test_catalog_tags.cjs <<'JS'
          'use strict';
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict'),path=require('path');
          const helper=fs.readFileSync(path.join(__dirname,'item-card-tags.js'),'utf8');
          const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const c={esc};vm.createContext(c);vm.runInContext(helper,c);
          const cases=[
            [{element:'火',job:'忍者',attackValue:80,weaponLevel:4},['火屬性','忍者專屬']],
            [{element:'無',job:'忍者'},['無屬性','忍者專屬']],
            [{element:null,job:'忍者'},['忍者專屬']],
            [{element:'水',job:'所有職業'},['水屬性']],
            [{element:null,job:'所有職業'},[]],
            [{element:'',job:''},[]],
            [{element:'未知',job:'未提供可解析限制'},[]],
            [{element:'風屬性',job:'忍者專屬'},['風屬性','忍者專屬']],
            [{job:'劍士 系列'},['劍士系限定']],
            [{job:'祭司 / 悟靈士 / 拳聖'},['祭司／悟靈士／拳聖限定']],
            [{job:'劍士 系列 / 商人系列'},['劍士系／商人系限定']],
            [{job:'忍者 / 忍者'},['忍者專屬']],
            [{job:'',jobTags:['忍者']},['忍者專屬']],
            [{job:'所有職業',jobTags:['忍者']},[]],
            [{job:'職業限制：忍者'},['忍者專屬']],
            [{element:undefined,jobTags:null,attackValue:400,defenseValue:10,weaponLevel:3},[]]
          ];
          for(const [item,expected] of cases){assert.deepEqual(Array.from(c.itemCardLabels(item),x=>x.text),expected);assert(!/ATK|DEF|武器|Lv\./.test(c.itemStatPills(item)));}
          const html=c.itemStatPills({element:'<script>alert(1)</script>',job:'<img onerror=1>'});assert(!html.includes('<script>'));assert(!html.includes('<img'));
          const root=process.argv[2]||'.';const ctx={window:{__atlasParts:[]},console};vm.createContext(ctx);
          for(const f of fs.readdirSync(path.join(root,'atlas-data')).filter(f=>/^part-\d+\.js$/.test(f)).sort())vm.runInContext(fs.readFileSync(path.join(root,'atlas-data',f),'utf8'),ctx);
          ctx.window.RODB=JSON.parse(ctx.window.__atlasParts.join(''));
          for(const f of ['model-previews-v11.js','model-previews-lowkey.js','map-corrections-r85.js','update-70b07.js','model-previews-front-70b07.js'])vm.runInContext(fs.readFileSync(path.join(root,'atlas-data',f),'utf8'),ctx);
          const d=ctx.window.RODB;assert.equal(d.meta.version,'Ro-Online 7.0b07');
          for(const i of d.items){const before=JSON.stringify(i);const h=c.itemStatPills(i);assert(!/ATK|DEF|武器|Lv\./.test(h));assert.equal(JSON.stringify(i),before);}
          const byId=new Map(d.items.map(i=>[i.id,i]));
          assert.deepEqual(Array.from(c.itemCardLabels(byId.get('I063')),x=>x.text),['無屬性','忍者專屬']);
          assert.deepEqual(Array.from(c.itemCardLabels(byId.get('IFXM')),x=>x.text),['忍者專屬']);
          assert.deepEqual(Array.from(c.itemCardLabels(byId.get('totw')),x=>x.text),['無屬性','神槍手專屬']);
          assert.deepEqual(Array.from(c.itemCardLabels(byId.get('I06G')),x=>x.text),['水屬性']);
          const s=fs.readFileSync(path.join(root,'index.html'),'utf8');assert(s.includes(helper.trim()));
          for(const [n,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].entries())new vm.Script(m[1],{filename:'inline-'+n});
          console.log(JSON.stringify({passed:true,edgeCases:cases.length,xssEscaped:true,itemCount:d.items.length,allCardsNoNumericPills:true,sourceDataUnchanged:true,version:d.meta.version},null,2));
          JS
          cat > /tmp/atlas-candidate/AGENTS.md <<'MD'
          # RO ATLAS maintenance
          Read `SITE_UPDATE_RULES.md` before changing models, catalog data, or the site UI.
          These are user-approved persistent requirements, not a request to delegate work.
          The active website version is `Ro-Online 7.0b07`. Preserve game data and the world-map correction workspace.
          Item-card labels are defined in `tools/catalog/item-card-tags.js` and embedded in `index.html`; keep them synchronized.
          Run `node tools/catalog/test_catalog_tags.cjs .` after any item-label update.
          Model previews use individual 10–15 degree left offsets and hide only foot-level hero glow; follow the full policy for new models too.
          Never call a local artifact or staging branch a completed production deployment. Verify the deployed site first.
          MD
          cd /tmp/atlas-candidate
          python tools/catalog/apply_catalog_tags.py .
          node tools/catalog/test_catalog_tags.cjs . | tee /tmp/catalog-qa/unit.json
          git diff --name-only | grep -x 'index.html'
          test -z "$(git diff --name-only -- atlas-data atlas-models wrangler.jsonc SITE_UPDATE_RULES.md)"
      - name: Test desktop and mobile catalog pages
        run: |
          python -m pip install --quiet playwright==1.57.0
          python -m playwright install --with-deps chromium
          cat > /tmp/catalog-qa/browser.py <<'PY'
          import asyncio,json,threading,functools,http.server
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path('/tmp/catalog-qa')
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(Quiet,directory='/tmp/atlas-candidate'))
          threading.Thread(target=server.serve_forever,daemon=True).start();base=f'http://127.0.0.1:{server.server_port}/'
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox']);page=await browser.new_page(viewport={'width':1440,'height':1000});errors=[];page.on('pageerror',lambda e:errors.append(str(e)));checks=[]
                  for route in ['monsters','items','cards','sockets','craft','world','saved','about','world?p=workspace']:
                      await page.goto(base+'#'+route,wait_until='networkidle');assert await page.locator('main').inner_text();checks.append('route:'+route)
                  await page.goto(base+'#items',wait_until='networkidle');await page.locator('select[data-filter="job"]').select_option('忍者');await page.wait_for_timeout(250)
                  pills=await page.locator('.item-stat-pills').all_inner_texts();assert any('忍者專屬' in x for x in pills);assert all(not any(t in x for t in ['ATK','DEF','武器','Lv.']) for x in pills);checks+=['ninja-class-pills','no-numeric-pills']
                  await page.screenshot(path=str(O/'items-ninja-desktop.png'))
                  await page.goto(base+'#items/i/I02I',wait_until='networkidle');await page.wait_for_selector('#detail[open]');detail=await page.locator('#detail').inner_text();assert '拳刃' in detail and '80' in detail;checks.append('detail-stats-retained')
                  await page.set_viewport_size({'width':390,'height':844});await page.goto(base+'#items',wait_until='networkidle');await page.locator('select[data-filter="job"]').select_option('忍者');await page.wait_for_timeout(250)
                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+2');await page.screenshot(path=str(O/'items-ninja-mobile.png'));checks.append('mobile-no-overflow');assert not errors,errors
                  report={'passed':True,'checks':checks,'ninjaPills':pills,'javascriptErrors':errors,'version':await page.evaluate('RODB.meta.version')};(O/'browser.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False));await browser.close()
          try:asyncio.run(main())
          finally:server.shutdown()
          PY
          python /tmp/catalog-qa/browser.py
      - name: Stage validated release without changing production
        run: |
          cd /tmp/atlas-candidate
          git config user.name 'RO Atlas site maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html AGENTS.md tools/catalog
          test "$(git diff --cached --name-only | wc -l)" = '5'
          git commit -m 'fix(atlas): show item attributes and class restrictions instead of numeric pills' -m 'Preserve game data and monster stats. Record the user-approved future-update rules. Remove weapon-level sorting from the warehouse; keep detailed raw values.'
          git push origin HEAD:refs/heads/atlas/catalog-tags-ready-20261030
          git rev-parse HEAD > /tmp/catalog-qa/release-commit.txt
          git rev-parse HEAD^{tree} > /tmp/catalog-qa/release-tree.txt
          cp index.html /tmp/catalog-qa/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-labels-verification
          path: /tmp/catalog-qa/
          retention-days: 7
