name: One-time RO ATLAS source-note correction
on:
  push:
    paths:
      - '.github/workflows/atlas-v10-provenance-fix.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct mixed-source note with strict guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const oldNote = "本圖鑑使用你提供的四個原生 MPQ 與 Ro-Online 7.0a03-v68 地圖，不套用官方 RO 數值。原生封包以實際提供內容為準，未推定精確遊戲子版本。";
          const newNote = "本次 7.0a09-v10 圖鑑已依提供的 Ro-Online 7.0a09-v10.w3x 更新可核對的地圖物件、物品、商店與合成資料；舊版 7.0a03-v68 的 MVP 隨機獎勵、套裝程式判定、英雄衍生值、地區邊界和部分靜態圖像仍待逐項重新驗證。四個原生 MPQ 作為基礎資產來源，不套用官方 RO 數值；原生封包子版本未另行推定。";
          if (html.split(oldNote).length - 1 !== 1 || !html.includes('"mapVersion":"7.0a09"')) throw Error('Unexpected atlas baseline');
          const updated = html.replace(oldNote, newNote);
          function db(s) { const begin = s.indexOf('window.RODB = ')+14; const end = s.indexOf(';\n</script>',begin); if(begin<14||end<begin)throw Error('RODB missing'); return JSON.parse(s.slice(begin,end)); }
          const a=db(html),b=db(updated);
          for (const key of Object.keys(a)) if (key !== 'meta' && JSON.stringify(a[key]) !== JSON.stringify(b[key])) throw Error('Data changed unexpectedly: '+key);
          if (b.monsters.length!==183 || b.items.length!==935 || b.recipes.length!==60 || b.shops.length!==18)throw Error('R8 count guard');
          fs.writeFileSync('index.html',updated);
          console.log('PASS: Provenance corrected, R8 records preserved.');
          NODE
      - name: Commit corrected HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Clarify mixed v10 and legacy data provenance in RO ATLAS'
            git push
          fi
