name: Apply RO ATLAS 7.0a09-v10 data update

on:
  push:
    paths:
      - '.atlas-updates/7.0a09-v10.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply map-sourced RO ATLAS data patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const file = 'index.html';
          const patchFile = '.atlas-updates/7.0a09-v10.b64';
          const patch = JSON.parse(zlib.inflateSync(Buffer.from(fs.readFileSync(patchFile, 'utf8').trim(), 'base64')).toString('utf8'));
          const html = fs.readFileSync(file, 'utf8');
          const prefix = 'window.RODB = ';
          const startAt = html.indexOf(prefix);
          if (startAt < 0) throw Error('RODB marker not found');
          const start = startAt + prefix.length;
          const end = html.indexOf(';' + String.fromCharCode(10) + '</script>', start);
          if (end < start) throw Error('RODB end marker not found');
          const db = JSON.parse(html.slice(start, end));
          if (db.meta.mapVersion !== '7.0a03' || db.items.length !== 930) {
            throw Error('Unexpected source index.html version; refusing to overwrite');
          }
          Object.assign(db.meta, patch.meta);
          db.meta.notes = [...patch.metaNotesPrepend, ...db.meta.notes];
          for (const section of ['monsters', 'items', 'drops', 'recipes']) {
            const byId = new Map(db[section].map(entry => [entry.id, entry]));
            for (const [id, [changes, removals]] of Object.entries(patch[section])) {
              const entity = byId.get(id);
              if (!entity) throw Error('Missing ' + section + '/' + id);
              for (const prop of removals) delete entity[prop];
              Object.assign(entity, changes);
            }
            if (patch[section + 'Added']) db[section].push(...patch[section + 'Added']);
          }
          db.shops = patch.shops;
          Object.assign(db.sources, patch.sources);
          if (db.meta.mapVersion !== '7.0a09' || db.items.length !== 935 ||
              db.monsters.length !== 183 || db.recipes.length !== 60) {
            throw Error('New atlas validation failed');
          }
          const updated = html.slice(0, start).replaceAll('7.0a03', '7.0a09') +
            JSON.stringify(db) + html.slice(end).replaceAll('7.0a03', '7.0a09');
          fs.writeFileSync(file, updated);
          console.log('RO ATLAS 7.0a09-v10 rebuilt:', db.monsters.length, 'monsters,', db.items.length, 'items,', db.recipes.length, 'recipes');
          NODE
      - name: Commit updated index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update RO ATLAS index.html with 7.0a09-v10 map data"
            git push
          fi
